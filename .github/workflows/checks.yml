name: Checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: glib-compile-schemas --strict --dry-run extension/schemas
      - run: node --check extension/extension.js
      - run: node --test tests/dock.test.mjs
      - run: node --check extension/prefs.js
      - run: npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs extension/*.js
      - run: node --check web/app.js
      - run: python -m archsport --demo --once
